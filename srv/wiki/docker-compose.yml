services:
  otterwiki:
    image: redimp/otterwiki:2
    container_name: otterwiki
    restart: unless-stopped
    volumes:
      - ${VOLUME_PATH}:/app-data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.otterwiki.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.services.otterwiki.loadbalancer.server.port=${OTTERWIKI_PORT}"
      - "traefik.http.routers.otterwiki.entrypoints=websecure"
      - "traefik.http.routers.otterwiki.tls=true"
networks:
  proxy:
    external: true