name: Deployement Workflow

on:
  push:
    branches: ["main"]
  workflow_dispatch: # permet d'avoir un bouton "Run Workflow" sur GitHub dans la section Actions

jobs:
  Deploy-Docker-Infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy on remote server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_TOKEN
          script: |
            # 1. Cloner le dépôt dans un dossier temporaire
            cd ~                
            rm -rf Serveur-Internet-Sample-Project
            git clone https://$GH_TOKEN@github.com/Wmartel31/Serveur-Internet-Sample-Project.git
            
            # 2. Copier les fichiers de config SAUF les .env
            # On utilise une boucle pour copier dossier par dossier pour ne pas écraser les .env
            cp -r ~/Serveur-Internet-Sample-Project/srv/traefik/* ~/srv/traefik/
            # Répétez pour les autres dossiers si nécessaire
            # cp -r ~/Serveur-Internet-Sample-Project/srv/wiki/* ~/srv/wiki/
            
            # 3. Nettoyer le dossier temporaire cloné
            rm -rf Serveur-Internet-Sample-Project
            
            # 4. Lancer Traefik
            cd ~/srv/traefik
            docker compose up -d --build
            
            # 5. Lancer votre infrastructure
            cd ~/srv/traefik
            docker compose up -d --build
