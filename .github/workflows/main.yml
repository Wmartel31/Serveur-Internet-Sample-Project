name: Deployement Workflow

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  Deploy-Docker-Infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy on remote server
        uses: appleboy/ssh-action@v1.2.0
        env:
          # --- MAPPING DES SECRETS GITHUB (CORRIGÉ) ---
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DOMAIN: ${{ secrets.DOMAIN_TRAEFIK }}
          DOMAIN_TINYAUTH: ${{ secrets.DOMAIN_TINYAUTH }}
          
          # Force le nom du réseau à "proxy"
          NETWORK_NAME: proxy 
          
          # Assurez-vous que ces secrets existent
          TRAEFIK_SUBDOMAIN: ${{ secrets.TRAEFIK_SUBDOMAIN }} 
          
          AUTH_MIDDLEWARE: ${{ secrets.AUTH_MIDDLEWARE }}
          TZ: ${{ secrets.TZ }}
          
          # Tasklist
          DOMAIN_TASKLIST: ${{ secrets.DOMAIN_TASKLIST }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
          TASKLIST_SUBDOMAIN: ${{ secrets.TASKLIST_SUBDOMAIN }}

          # Wiki
          DOMAIN_NAME_WIKI: ${{ secrets.DOMAIN_NAME }}
          WIKI_SUBDOMAIN: ${{ secrets.WIKI_SUBDOMAIN }}
          WIKI_PORT: ${{ secrets.WIKI_PORT }}
          
          # Monitoring & Fail2ban
          DOMAIN_UPTIME: ${{ secrets.DOMAIN_UPTIME }}
          DOMAIN_FAIL2BAN: ${{ secrets.DOMAIN_FAIL2BAN }}
          UPTIME_SUBDOMAIN: ${{ secrets.UPTIME_SUBDOMAIN }}
          UPTIME_PORT: ${{ secrets.UPTIME_PORT }}
          F2B_PORT: ${{ secrets.F2B_PORT }}
          
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # LISTE COMPLETE DES VARIABLES PASSEES AU SCRIPT
          envs: GH_TOKEN,DOMAIN,DOMAIN_TINYAUTH,NETWORK_NAME,TRAEFIK_SUBDOMAIN,AUTH_MIDDLEWARE,TZ,DOMAIN_TASKLIST,DB_HOST,DB_NAME,DB_USER,DB_PASSWORD,BACKEND_PORT,BACKEND_HOST,FRONTEND_PORT,TASKLIST_SUBDOMAIN,DOMAIN_NAME_WIKI,WIKI_SUBDOMAIN,WIKI_PORT,DOMAIN_UPTIME,DOMAIN_FAIL2BAN,UPTIME_SUBDOMAIN,UPTIME_PORT,F2B_PORT
          script: |
            # 1. Vérification de git (pour Rocky Linux)
            if ! command -v git &> /dev/null; then
                echo "Erreur: git n'est pas installé."
                exit 1
            fi

            # 2. Préparation du réseau
            docker network create ${NETWORK_NAME} || true
            
            # 3. Clonage et mise à jour des fichiers
            cd ~
            rm -rf temp_repo
            git clone https://x-access-token:${GH_TOKEN}@github.com/Wmartel31/Serveur-Internet-Sample-Project.git temp_repo
            
            mkdir -p ~/srv
            cp -r ~/temp_repo/srv/* ~/srv/
            rm -rf temp_repo
            
            # 4. Configuration et Lancement par service

            # --- TRAEFIK ---
            mkdir -p ~/srv/traefik
            cat <<EOF > ~/srv/traefik/.env
            DOMAIN_TRAEFIK=${DOMAIN}
            DOMAIN_TINYAUTH=${DOMAIN_TINYAUTH}
            EOF
            cd ~/srv/traefik && docker compose up -d --build --force-recreate
            
            # --- TASKLIST ---
            mkdir -p ~/srv/tasklist
            cat <<EOF > ~/srv/tasklist/.env
            DOMAIN_TASKLIST=${DOMAIN_TASKLIST}
            NETWORK_NAME=${NETWORK_NAME}
            TASKLIST_SUBDOMAIN=${TASKLIST_SUBDOMAIN}
            DB_HOST=${DB_HOST}
            DB_NAME=${DB_NAME}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            BACKEND_PORT=${BACKEND_PORT}
            BACKEND_HOST=${BACKEND_HOST}
            FRONTEND_PORT=${FRONTEND_PORT}
            EOF
            cd ~/srv/tasklist && docker compose up -d --build --force-recreate
            
            # --- WIKI ---
            mkdir -p ~/srv/wiki
            cat <<EOF > ~/srv/wiki/.env
            DOMAIN_NAME=${DOMAIN_NAME_WIKI}
            NETWORK_NAME=${NETWORK_NAME}
            WIKI_SUBDOMAIN=${WIKI_SUBDOMAIN}
            WIKI_PORT=${WIKI_PORT}
            EOF
            cd ~/srv/wiki && docker compose up -d --build --force-recreate
            
            # --- MONITORING ---
            mkdir -p ~/srv/monitoring
            cat <<EOF > ~/srv/monitoring/.env
            DOMAIN_UPTIME=${DOMAIN_UPTIME}
            NETWORK_NAME=${NETWORK_NAME}
            UPTIME_SUBDOMAIN=${UPTIME_SUBDOMAIN}
            UPTIME_PORT=${UPTIME_PORT}
            EOF
            cd ~/srv/monitoring && docker compose up -d --build --force-recreate
            
            # --- FAIL2BAN ---
            mkdir -p ~/srv/fail2ban
            cat <<EOF > ~/srv/fail2ban/.env
            DOMAIN_FAIL2BAN=${DOMAIN_FAIL2BAN}
            F2B_PORT=${F2B_PORT}
            TZ=${TZ}
            EOF
            cd ~/srv/fail2ban && docker compose up -d --build --force-recreate
            
            # Maintenance
            docker image prune -f
